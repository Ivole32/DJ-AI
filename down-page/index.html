<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:24px;
  overflow-x:hidden;
}

.background{
  position:fixed;
  inset:0;
  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.08),
      transparent 65%
    );
  pointer-events:none;
}

.card{
  width:100%;
  max-width:850px;
  text-align:center;

  background:rgba(255,255,255,.03);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(20px);

  border-radius:32px;

  padding:64px 40px;

  position:relative;
}

.badge{
  display:inline-block;

  border:1px solid rgba(255,255,255,.12);

  color:rgba(255,255,255,.65);

  padding:10px 16px;

  border-radius:999px;

  letter-spacing:.2em;

  font-size:12px;

  margin-bottom:24px;
}

h1{
  font-size:clamp(3rem,7vw,5rem);
  line-height:1.1;
}

.description{
  margin-top:24px;
  color:rgba(255,255,255,.85);
  font-size:1.15rem;
  line-height:1.8;
}

.secondary{
  margin-top:12px;
  color:rgba(255,255,255,.5);
  line-height:1.8;
}

.links{
  margin-top:40px;

  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}

.links a{
  text-decoration:none;

  color:white;

  padding:14px 22px;

  border-radius:14px;

  border:1px solid rgba(255,255,255,.1);

  background:rgba(255,255,255,.03);

  transition:.2s;
}

.links a:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.08);
}

.footer{
  margin-top:40px;
}

.footer a{
  color:rgba(255,255,255,.6);
  text-decoration:none;
}

.footer a:hover{
  color:white;
}

@media(max-width:768px){

  .card{
    padding:40px 24px;
  }

  h1{
    font-size:2.5rem;
  }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="card">

<div class="badge">
SERVICE STATUS
</div>

<h1>Service Discontinued</h1>

<p class="description">

</p>

<p class="secondary">
Thank you to everyone who supported and used this project.
</p>

</div>

</div>
